function ruleTypeClass(type) {
  if (!type) return "";
  if (type === "MATCH") return "match";
  if (type.startsWith("GEO") || type === "RULE-SET" || type === "SUB-RULE") return "geo";
  if (type.startsWith("IP-") || type.startsWith("SRC-IP") || type === "DST-PORT" || type === "SRC-PORT" || type === "NETWORK") return "ip";
  if (type.startsWith("PROCESS")) return "process";
  return "";
}
function targetClass(target) {
  const value = String(target || "").toUpperCase();
  if (value.includes("REJECT")) return "reject";
  if (value === "DIRECT") return "direct";
  return "";
}
function filteredRules() {
  const query = App.rulesSearch.trim().toLowerCase();
  const rules = App.rules?.rules || [];
  if (!query) return rules;
  return rules.filter(rule => [rule.type, rule.payload, rule.target, ...(rule.options || [])].some(v => String(v || "").toLowerCase().includes(query)));
}
function renderRulesPage() {

function renderRulesRows() {
  const body = $("#rules-body");
  if (!body) return;
  const rules = filteredRules();
  const total = rules.length;
  const pages = Math.max(1, Math.ceil(total / App.rulesPageSize));
  App.rulesPage = Math.max(1, Math.min(App.rulesPage, pages));
  const start = (App.rulesPage - 1) * App.rulesPageSize;
  const pageRules = rules.slice(start, start + App.rulesPageSize);
  const empty = `<tr><td colspan="6"><div class="empty-state" style="padding:40px 12px">
    <div class="empty-icon">${icon("search", 19)}</div><strong>${App.rulesSearch ? "没有匹配的规则" : "还没有路由规则"}</strong>
    <p>${App.rulesSearch ? "换一个关键词试试，或清空搜索。" : "添加第一条规则，让流量按你的方式流动。"}</p>
  </div></td></tr>`;
  body.innerHTML = pageRules.length ? pageRules.map(rule => `
    <tr>
      <td class="rule-index">${String(rule.index + 1).padStart(2, "0")}</td>
      <td><span class="rule-type ${ruleTypeClass(rule.type)}">${escapeHtml(rule.type)}</span></td>
      <td><span class="rule-payload">${escapeHtml(rule.type === "MATCH" ? "所有未匹配的流量" : rule.payload || "—")}</span></td>
      <td><span class="target-chip ${targetClass(rule.target)}" title="${escapeAttr(rule.target)}">${escapeHtml(rule.target)}</span></td>
      <td><div class="rule-options">${(rule.options || []).map(opt => `<span class="rule-opt">${escapeHtml(opt)}</span>`).join("") || '<span class="faint">—</span>'}</div></td>
      <td><div class="row-actions">
        <button class="row-action" type="button" data-action="edit-rule" data-index="${rule.index}" title="编辑规则">${icon("edit", 12)}</button>
        <button class="row-action danger" type="button" data-action="delete-rule" data-index="${rule.index}" title="删除规则">${icon("trash", 12)}</button>
      </div></td>
    </tr>`).join("") : empty;
  const label = $("#rules-count-label");
  if (label) {
    label.textContent = total
      ? `共 ${total} 条规则${App.rulesSearch ? `（已筛选，原始 ${App.rules?.rules?.length || 0} 条）` : ""} · 第 ${App.rulesPage} / ${pages} 页`
      : "0 条规则";
  }
  const pager = $("#rules-pager");
  if (pager) {
    if (pages <= 1) { pager.innerHTML = ""; return; }
    const buttons = [];
    buttons.push(`<button type="button" data-action="rule-page" data-page-num="${App.rulesPage - 1}" ${App.rulesPage === 1 ? "disabled" : ""}>上一页</button>`);
    const candidates = new Set([1, pages, App.rulesPage - 1, App.rulesPage, App.rulesPage + 1]);
    let last = 0;
    [...candidates].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b).forEach(n => {
      if (n - last > 1) buttons.push(`<span class="faint" style="padding:0 2px">…</span>`);
      buttons.push(`<button type="button" data-action="rule-page" data-page-num="${n}" class="${n === App.rulesPage ? "active" : ""}">${n}</button>`);
      last = n;
    });
    buttons.push(`<button type="button" data-action="rule-page" data-page-num="${App.rulesPage + 1}" ${App.rulesPage === pages ? "disabled" : ""}>下一页</button>`);
    pager.innerHTML = buttons.join("");
  }
}

function renderConnectionsLive() {
  if (App.page !== "connections") return;
  const body = $("#connections-body");
  if (!body) return;
  const allItems = filteredConnections();
  // Grouping is cheap and lets every retained session appear as a group row.
  // Only the ungrouped list needs the 300-row DOM guard.
  const items = App.connGrouped ? allItems : allItems.slice(0, 300);
  queueProcessIcons(allItems);
  const groups = App.connGrouped ? groupConnections(allItems) : [];
  const multiGroups = groups.filter(group => group.count > 1);
  const totalCount = App.connections?.totalCount ?? (App.connections?.connections?.length || 0);
  const activeCount = App.connections?.activeCount ?? App.connections?.count ?? 0;
  const closedCount = App.connections?.closedCount ?? 0;
  const metrics = App.metrics || {};
  const setText = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
  setText("conn-total-count", String(activeCount));
  setText("conn-down-speed", fmtRate(metrics.down || 0));
  setText("conn-up-speed", fmtRate(metrics.up || 0));
  setText("conn-total-traffic", fmtBytes((metrics.todayDown || 0) + (metrics.todayUp || 0)));
  setText("conn-history-total", String(totalCount));
  setText("conn-history-breakdown", `${activeCount} 活跃 · ${closedCount} 断开`);
  setText("conn-history-up", fmtBytes(App.connections?.uploadTotal || 0));
  setText("conn-history-down", fmtBytes(App.connections?.downloadTotal || 0));
  setText("conn-history-duration", fmtDurationLong(App.connections?.totalDuration || 0));
  const closeAllBtn = $('[data-action="close-all-connections"]');
  if (closeAllBtn) closeAllBtn.disabled = activeCount === 0;
  const clearClosedBtn = $('[data-action="clear-closed-connections"]');
  if (clearClosedBtn) clearClosedBtn.disabled = closedCount === 0;
  const countLabel = $("#connections-count-label");
  const groupSuffix = App.connGrouped ? ` · 合并为 ${groups.length} 个应用组` : "";
  if (countLabel) countLabel.textContent = App.connSearch
    ? `显示 ${allItems.length} / ${totalCount} 条连接${groupSuffix}`
    : `共 ${totalCount} 条连接记录（${activeCount} 活跃 / ${closedCount} 已断开）${groupSuffix}`;
  const expandBtn = $("#conn-expand-btn");
  if (expandBtn) {
    const allExpanded = multiGroups.length > 0 && multiGroups.every(group => App.expandedConnGroups.has(group.key));
    expandBtn.innerHTML = `${icon("chevronDown", 13)} ${allExpanded ? "全部折叠" : "全部展开"}`;
    expandBtn.classList.toggle("active", allExpanded);
  }
  if (!items.length) {
    body.innerHTML = `<tr><td colspan="9"><div class="empty-state" style="padding:44px 12px">
      <div class="empty-icon">${icon(App.connSearch ? "search" : "activity", 20)}</div>
      <strong>${App.connSearch ? "没有匹配的连接" : totalCount ? "没有活跃连接" : "当前没有连接记录"}</strong>
      <p>${App.connSearch ? "尝试更换关键词。" : totalCount ? "已断开的连接仍会保留在列表中。" : "发起一些网络请求后，连接会实时出现在这里。"}</p>
    </div></td></tr>`;
    return;
  }
  const rows = [];
  if (!App.connGrouped) {
    items.forEach(connection => rows.push(connectionRowHtml(connection)));
  } else {
    for (const group of groups) {
      if (group.count === 1 && group.kind !== "dns") {
        rows.push(connectionRowHtml(group.items[0]));
        continue;
      }
      const expanded = App.expandedConnGroups.has(group.key);
      rows.push(connectionGroupRowHtml(group, expanded));
      if (expanded) {
        const childLimit = 500;
        group.items.slice(0, childLimit).forEach(connection => rows.push(connectionRowHtml(connection, true)));
        if (group.items.length > childLimit) {
          rows.push(`<tr class="conn-child-row"><td colspan="9"><div class="conn-group-truncated">仅显示前 ${childLimit} 条，当前组合共 ${group.items.length} 条记录</div></td></tr>`);
        }
      }
    }
  }
  body.innerHTML = rows.join("");
  hydrateIcons(body);
}
function updateConnectionDurations() {
  if (App.page !== "connections" || hasActiveConnectionSelection()) return;
  const now = Date.now() / 1000;
  $$("[data-start]").forEach(el => {
    const start = Number(el.dataset.start) || now;
    const end = Number(el.dataset.end) || now;
    el.textContent = fmtDuration(Math.max(0, end - start));
  });
}

const LOG_LEVELS = [

function logMatches(entry) {
  if (App.logLevel !== "all" && entry.level !== App.logLevel) return false;
  const query = App.logSearch.trim().toLowerCase();
  if (query && !String(entry.message || "").toLowerCase().includes(query)) return false;
  return true;
}

      <span id="log-footer-meta">共 0 条日志 · 仅保留最近 1000 条</span>
    </div>`;

function renderLogLines(forceBottom = false) {
  if (App.page !== "logs") return;
  const terminal = $("#log-terminal");
  if (!terminal) return;
  const atBottom = terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 70;
  const filtered = App.logs.filter(logMatches).slice(-500);
  const counts = { all: App.logs.length, info: 0, warning: 0, error: 0, debug: 0 };
  App.logs.forEach(entry => { if (counts[entry.level] != null) counts[entry.level] += 1; });
  Object.entries(counts).forEach(([key, value]) => {
    const el = document.getElementById(`log-count-${key}`);
    if (el) el.textContent = String(value);
  });
  if (!filtered.length) {
    terminal.innerHTML = `<div class="log-terminal-empty">${App.logs.length ? "当前筛选条件下没有日志" : "暂无日志 · 启动内核后这里会显示运行记录"}</div>`;
  } else {
    terminal.innerHTML = filtered.map(entry => `
      <div class="log-line ${escapeAttr(entry.level)}">
        <time>${timeString(entry.time)}</time>
        <span class="log-level">${escapeHtml(entry.level)}</span>
        <span class="log-msg">${escapeHtml(entry.message)}</span>
      </div>`).join("");
  }
  const meta = $("#log-footer-meta");
  if (meta) meta.textContent = `显示 ${filtered.length} 条 · 共 ${App.logs.length} 条日志`;
  if ((forceBottom || (atBottom && !App.logsPaused)) && filtered.length) {
    requestAnimationFrame(() => { terminal.scrollTop = terminal.scrollHeight; });
  }
}

function hostRouteRules(host) {
  const value = String(host || "").trim();
  if (!value) return [];
  if (isIpAddress(value)) {
    return [{ type: value.includes(":") ? "IP-CIDR6" : "IP-CIDR", value }];
  }
  return [{ type: "DOMAIN", value }];
}
function groupRouteRules(group) {
  const rules = [];
  const seen = new Set();
  const add = (type, value) => {
    const cleaned = String(value || "").trim();
    if (!cleaned) return;
    const key = `${type}:${cleaned.toLowerCase()}`;
    if (seen.has(key)) return;
    seen.add(key);
    rules.push({ type, value: cleaned });
  };
  if (group.kind === "app") {
    for (const process of group.processes || []) add("PROCESS-NAME", process);
    if (rules.length) return rules;
  }
  if (group.kind === "host") {
    if (isIpAddress(group.label)) {
      add(group.label.includes(":") ? "IP-CIDR6" : "IP-CIDR", group.label);
    } else {
      add("DOMAIN-SUFFIX", group.label);
    }
    return rules;
  }
  if (group.kind === "brand") {
    const bases = new Set();
    for (const item of group.items || []) {
      const host = connectionHostKey(item);
      if (host && !isIpAddress(host)) bases.add(connectionBaseDomain(host));
    }
    for (const base of bases) add("DOMAIN-SUFFIX", base);
    return rules;
  }
  for (const item of group.items || []) {
    const host = connectionHostKey(item);
    if (!host) continue;
    add(isIpAddress(host) ? (host.includes(":") ? "IP-CIDR6" : "IP-CIDR") : "DOMAIN", host);
  }
  return rules;
}
function detectRouteTarget(rules) {
  const overrides = App.state?.routeOverrides || [];
  const keys = new Set(rules.map(rule => `${rule.type}:${String(rule.value).toLowerCase()}`));
  const targets = [...new Set(overrides
    .filter(entry => keys.has(`${entry.type}:${String(entry.value).toLowerCase()}`))
    .map(entry => entry.target)
    .filter(Boolean))];
  return targets.length === 1 ? targets[0] : "auto";
}
function routePolicyOptions() {
  const options = [
    { value: "auto", label: "跟随规则（清除此组合的覆盖）" },
    { value: "DIRECT", label: "直连（国内流量）" }

  }
  for (const group of App.proxy?.groups || []) {

    if (options.some(option => option.value === group.name)) continue;
    if (["GLOBAL", "FINAL"].includes(group.name)) continue;
    options.push({ value: group.name, label: `策略组 · ${group.name}` });

}

function groupBlockedEntries(group) {

    hosts = [group.label];

  }

  const scopeText = processes.length

      : ` 的 ${hosts.length} 个目标`;

    title: "禁止整个组合联网",

async function copyLogs() {
  const lines = App.logs.filter(logMatches).slice(-500).map(entry => `[${timeString(entry.time)}] [${entry.level.toUpperCase()}] ${entry.message}`);
  const text = lines.join("\n");
  if (!text) { toast("当前没有可复制的日志", "info"); return; }
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
    else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    toast("日志已复制", "success", `${lines.length} 条记录已写入剪贴板`);
  } catch (_) {
    toast("复制失败", "error", "浏览器未授予剪贴板权限");

function settingsFormSnapshot() {

  const bar = $("#settings-autosave");

function scheduleSettingsSave(delay = 650) {
  if (App.page !== "settings" || !$("#settings-autosave")) return;
  clearTimeout(App.settingsSaveTimer);
  setAutoSaveState("saving", "等待保存…");
  App.settingsSaveTimer = setTimeout(() => {
    App.settingsSaveTimer = null;
    autoSaveSettings();
  }, delay);
}
async function autoSaveSettings() {
  if (App.page !== "settings") return;
  if (App.settingsSaving) {
    App.settingsSaveQueued = true;
    return;
  }
  const values = settingsFormSnapshot();
  if (!values) {
    setAutoSaveState("error", "端口无效");
    return;
  }
  const current = App.state?.settings || {};
  const patch = {};
  for (const key of ["engineMode", "autoStart", "corePath", "mixedPort", "controllerPort", "secret", "allowLan", "ipv6", "bypass", "theme", "accent"]) {
    const next = values[key];
    const prev = current[key];
    if ((typeof next === "number" || typeof next === "boolean") ? next !== prev : String(next ?? "") !== String(prev ?? "")) {
      patch[key] = next;
    }
  }
  if (!Object.keys(patch).length) {
    setAutoSaveState("saved", "已同步");
    return;
  }
  App.settingsSaving = true;
  setAutoSaveState("saving", "保存中…");
  try {
    const result = await api("/api/settings", { method: "PUT", body: patch });
    if (App.state) {
      App.state.settings = result.settings || { ...App.state.settings, ...patch };
      if (result.engine) App.state.engine = { ...App.state.engine, ...result.engine };
    }
    if (App.proxy && patch.mode) App.proxy.mode = patch.mode;
    updateShell();
    const needsRestart = Boolean(result.restartRequired || patch.engineMode);
    if (needsRestart) setAutoSaveState("saving", "已保存 · 需重启内核");
    else setAutoSaveState("saved", "已保存");
  } catch (err) {
    setAutoSaveState("error", "保存失败");
    toast("自动保存失败", "error", err.message, 5000);
  } finally {
    App.settingsSaving = false;
    if (App.settingsSaveQueued) {
      App.settingsSaveQueued = false;
      if (App.page === "settings") scheduleSettingsSave(250);
    }
  }
}
async function persistSettingsPatch(patch) {
  try {
    const result = await api("/api/settings", { method: "PUT", body: patch });
    if (App.state) {
      App.state.settings = result.settings || { ...App.state.settings, ...patch };
      if (result.engine) App.state.engine = { ...App.state.engine, ...result.engine };
    }
    updateShell();
    if (App.page === "settings") setAutoSaveState("saved", "已保存");
    return true;
  } catch (err) {
    if (App.page === "settings") setAutoSaveState("error", "保存失败");
    toast("自动保存失败", "error", err.message, 5000);
    return false;
  }
}
function bindSettingsAutoSave() {
  const schedule = delay => () => scheduleSettingsSave(delay);
  for (const id of ["setting-corePath", "setting-secret", "setting-mixedPort", "setting-controllerPort"]) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.addEventListener("change", schedule(0));
    if (el.tagName === "INPUT" && el.type !== "number") {
      el.addEventListener("keydown", event => {
        if (event.key === "Enter") { event.preventDefault(); el.blur(); }
      });
    }
  }
  const bypass = $("#setting-bypass");
  if (bypass) {
    bypass.addEventListener("input", schedule(800));
    bypass.addEventListener("change", schedule(0));
  }
  for (const id of ["setting-autoStart", "setting-allowLan", "setting-ipv6"]) {
    const el = document.getElementById(id);
    if (el) el.addEventListener("change", schedule(0));
  }
}

async function dispatchAction(action, el) {

      await toggleEngine();
      break;
    case "select-node":
      await selectNode(el.dataset.group, el.dataset.name);
      break;
    case "select-group":
      App.selectedGroup = el.dataset.group || App.selectedGroup;
      renderProxiesPage();
      break;

      await setMode(el.dataset.mode);
      break;
    case "test-node":
      await testNode(el.dataset.name);
      break;
    case "test-group":
      await testGroup(el.dataset.group);
      break;
    case "favorite-node":
      toggleFavoriteNode(el.dataset.name);
      break;
    case "toggle-favorites":
      toggleFavorites(el);
      break;
    case "toggle-system-proxy": {
      const status = App.state?.systemProxy || {};
      await setSystemProxy(!(status.ours && status.enabled));
      break;
    }
    case "chart-range": {
      const range = Number(el.dataset.range) || 60;
      App.chartRange = range;
      $$("#chart-range button").forEach(btn => btn.classList.toggle("active", Number(btn.dataset.range) === range));
      App.chartHover = null;
      drawTrafficChart();
      break;
    }
    case "import-profile":
      openImportModal();
      break;
    case "activate-profile":
      await activateProfile(el.dataset.id);
      break;
    case "refresh-profile":
      await refreshProfile(el.dataset.id);
      break;
    case "delete-profile":
      await deleteProfile(el.dataset.id);
      break;
    case "add-rule":
      openRuleModal();
      break;
    case "edit-rule":
      openRuleModal(Number(el.dataset.index));
      break;
    case "delete-rule":
      await deleteRule(Number(el.dataset.index));
      break;
    case "rule-page":
      App.rulesPage = Math.max(1, Number(el.dataset.pageNum) || 1);
      renderRulesRows();
      break;
    case "reload-rules": {
      setBusy(true, "正在重载路由配置…");
      try {
        const result = await api("/api/rules/reload", { method: "POST" });
        toast(result.reloaded ? "配置已热重载" : "当前没有运行中的真实内核", result.reloaded ? "success" : "info", result.reloaded ? "" : "规则将在下次启动内核时生效");
        await refreshRules();
        renderRulesPage();
      } catch (err) {
        toast("重载失败", "error", err.message);
      } finally {
        setBusy(false);
      }
      break;
    }
    case "close-connection":
      await closeConnection(el.dataset.id);
      break;
    case "close-all-connections":
      await closeAllConnections();
      break;
    case "clear-closed-connections":
      await clearClosedConnections();
      break;
    case "route-host": {
      const host = el.dataset.host || "";
      const rules = hostRouteRules(host);
      if (!rules.length) break;
      openRouteModal({ description: `单条连接 · ${host}`, rules });
      break;
    }
    case "route-group": {
      const group = currentGroupByKey(el.dataset.key || "");
      if (!group) break;
      const rules = groupRouteRules(group);
      if (!rules.length) {
        toast("这个组合没有可匹配的路由目标", "error");
        break;
      }
      openRouteModal({ description: `组合 · ${group.label}（${group.count} 条连接）`, rules });
      break;
    }
    case "apply-route-override":
      await applyRouteOverride();
      break;
    case "block-host":
      await blockConnection(el.dataset.host || "");
      break;
    case "block-group":
      await blockGroup(el.dataset.key || "");
      break;
    case "unblock-group":
      await unblockGroup(el.dataset.key || "");
      break;
    case "delete-group":
      await deleteGroupHistory(el.dataset.key || "");
      break;
    case "delete-history":
      await deleteHistoryRecord(el.dataset.id || "");
      break;
    case "open-blocklist":
      openBlocklistModal();
      break;
    case "remove-block":
      await removeBlockRule(el.dataset.id || "");
      break;
    case "toggle-conn-grouping":
      App.connGrouped = !App.connGrouped;
      try { localStorage.setItem("cp-conn-grouped", String(App.connGrouped)); } catch (_) {}
      renderConnectionsPage();
      break;
    case "toggle-conn-group": {
      const key = el.dataset.key || "";
      if (!key) break;
      if (String(window.getSelection() || "").trim()) break;
      if (App.expandedConnGroups.has(key)) App.expandedConnGroups.delete(key);
      else App.expandedConnGroups.add(key);
      renderConnectionsLive();
      break;
    }
    case "toggle-conn-expand": {
      const groups = groupConnections(filteredConnections().slice(0, 300)).filter(group => group.count > 1);
      const allExpanded = groups.length > 0 && groups.every(group => App.expandedConnGroups.has(group.key));
      groups.forEach(group => {
        if (allExpanded) App.expandedConnGroups.delete(group.key);
        else App.expandedConnGroups.add(group.key);
      });
      renderConnectionsLive();
      break;
    }
    case "toggle-conns-pause":
      App.connsPaused = !App.connsPaused;
      updateConnectionsPauseButton();
      if (!App.connsPaused) {
        await refreshConnections();
        renderConnectionsLive();
      }
      break;
    case "set-log-level":
      App.logLevel = el.dataset.level || "all";
      $$("#log-levels button").forEach(btn => btn.classList.toggle("active", btn.dataset.level === App.logLevel));
      renderLogLines();
      break;
    case "toggle-logs-pause":
      App.logsPaused = !App.logsPaused;
      updateLogsPauseButton();
      if (!App.logsPaused) refreshLogs();
      break;
    case "copy-logs":
      await copyLogs();
      break;
    case "clear-logs":
      await clearLogs();
      break;
    case "choose-engine-mode":
      chooseEngineMode(el.dataset.engineMode);
      break;
    case "detect-core":
      await detectCore();
      break;
    case "use-detected-core": {
      const path = App.state?.engine?.detectedPath;
      const input = $("#setting-corePath");
      if (path && input) {
        input.value = path;
        scheduleSettingsSave(0);
        toast("已填入内核路径", "success", "已自动保存，重启内核后生效");
      }
      break;
    }
    case "set-theme":
      chooseTheme(el.dataset.themeChoice);
      break;
    case "set-accent":
      chooseAccent(el.dataset.accentChoice);
      break;
    case "set-text-scale":
      chooseTextScale(Number(el.dataset.textScaleChoice));
      break;
    case "console-window-show":
      await setConsoleWindowVisibility(true);
      break;
    case "console-window-hide":
      await setConsoleWindowVisibility(false);
      break;
    case "restart-engine":
      await restartCore();
      break;
    case "open-data":
      try {
        await api("/api/open-data", { method: "POST" });
        toast("已打开数据目录", "success");
      } catch (err) {
        toast("无法打开目录", "error", err.message);
      }
      break;
    case "retry-init":
      window.location.reload();
      break;
    case "reload-page":
      if (App.page === "settings") {
        renderSettingsPage();
        toast("已还原未保存的更改", "info", "", 1800);
      } else {
        await renderPage(App.page);
      }
      break;
    case "submit-import":
      await submitImport();
      break;
    case "import-tab":
      switchImportTab(el.dataset.tab);
      break;
    case "submit-rule":
      await submitRule();
      break;
    default:
      console.warn("Unknown action", action);
  }
}

/* ============================================================
   Modals
   ============================================================ */
function openModal(inner, options = {}) {
  const root = $("#modal-root");
  if (!root) return;
  if (App.modalOpen) closeModal(true);
  root.innerHTML = `<div class="modal-backdrop" role="dialog" aria-modal="true">${inner}</div>`;
  document.body.classList.add("modal-open");
  App.modalOpen = true;
  const backdrop = $(".modal-backdrop", root);
  requestAnimationFrame(() => backdrop?.classList.add("show"));
  backdrop?.addEventListener("click", event => {
    if (event.target === backdrop) {
      if (App.confirmResolve) {
        const resolve = App.confirmResolve;
        App.confirmResolve = null;
        closeModal(true);
        resolve(false);
      } else closeModal();
    }
  });
  const focusTarget = $("input, select, textarea, button", $(".modal", root));
  setTimeout(() => focusTarget?.focus(), 80);
}
function closeModal(immediate = false) {
  const root = $("#modal-root");
  if (!root) return;
  const backdrop = $(".modal-backdrop", root);
  const finish = () => {
    root.innerHTML = "";
    document.body.classList.remove("modal-open");
    App.modalOpen = false;
  };
  if (App.confirmResolve) {
    const resolve = App.confirmResolve;
    App.confirmResolve = null;
    resolve(false);
  }
  if (immediate || !backdrop) { finish(); return; }
  backdrop.classList.remove("show");
  document.body.classList.remove("modal-open");
  App.modalOpen = false;
  setTimeout(finish, 180);
}
function confirmDialog({ title, message, confirmText = "确认", cancelText = "取消", danger = false }) {
  return new Promise(resolve => {
    App.confirmResolve = resolve;
    openModal(`
      <div class="modal modal-sm">
        <div class="modal-head">
          <div><h2>${escapeHtml(title)}</h2></div>
          <button class="modal-close" type="button" data-action="close-modal" aria-label="关闭">${icon("close", 13)}</button>
        </div>
        <div class="modal-body"><div class="confirm-message">${message}</div></div>
        <div class="modal-foot">
          <button class="btn btn-soft" type="button" data-confirm="no">${escapeHtml(cancelText)}</button>
          <button class="btn ${danger ? "btn-danger-soft" : "btn-primary"}" type="button" data-confirm="yes">${escapeHtml(confirmText)}</button>
        </div>
      </div>`, { small: true });
    hydrateIcons($("#modal-root"));
  });
}
function resolveConfirm(value) {
  const resolve = App.confirmResolve;
  App.confirmResolve = null;
  closeModal();
  if (resolve) resolve(value);
}
function openImportModal() {
  App.importState = { mode: "url", content: "", filename: "" };
  openModal(`
    <div class="modal">
      <div class="modal-head">
        <div><h2>导入配置</h2><p>从订阅链接下载，或导入本机的 Clash / Mihomo YAML 文件。</p></div>
        <button class="modal-close" type="button" data-action="close-modal" aria-label="关闭">${icon("close", 13)}</button>
      </div>
      <div class="modal-body">
        <div class="import-tabs">
          <button type="button" class="${App.importState.mode === "url" ? "active" : ""}" data-action="import-tab" data-tab="url">${icon("link", 13)} 订阅链接</button>
          <button type="button" data-action="import-tab" data-tab="file">${icon("file", 13)} 本地文件</button>
        </div>
        <div id="import-url-panel">
          <div class="form-field">
            <label for="import-url">订阅地址</label>
            <input class="input" id="import-url" type="url" placeholder="https://example.com/subscription?token=..." autocomplete="off" spellcheck="false">
            <div class="form-hint">支持 Clash / Mihomo YAML 订阅，下载失败时会保留现有配置。</div>
          </div>
        </div>
        <div id="import-file-panel" class="hidden">
          <div class="form-field">
            <label>配置文件</label>
            <div class="dropzone" id="import-dropzone">
              <span class="dz-icon">${icon("upload", 15)}</span>
              <strong>点击选择或拖拽 YAML 文件到这里</strong>
              <span>支持 .yaml / .yml / .txt，最大 12 MB</span>
              <span class="dz-file" id="import-file-name"></span>
            </div>
            <input type="file" id="import-file" accept=".yaml,.yml,.txt,text/yaml,text/plain" class="hidden">
            <div class="form-field" style="margin-top:12px">
              <label for="import-content">或直接粘贴 YAML <span class="optional">可选</span></label>
              <textarea class="textarea" id="import-content" placeholder="proxies:&#10;  - name: ..." spellcheck="false"></textarea>
            </div>
          </div>
        </div>
        <div class="form-field">
          <label for="import-name">配置名称 <span class="optional">留空则从订阅或文件名读取</span></label>
          <input class="input" id="import-name" type="text" placeholder="例如：机场主订阅" maxlength="80" autocomplete="off">
        </div>
        <div class="check-row">
          <input type="checkbox" id="import-activate" checked>
          <label for="import-activate">导入后立即启用该配置</label>
        </div>
        <div class="hint-box" style="margin-top:14px;margin-bottom:0">${icon("info", 12)}<span>远程订阅会保存在本机，不会自动定时刷新；可在配置库中手动刷新。</span></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-soft" type="button" data-action="close-modal">取消</button>
        <button class="btn btn-primary" type="button" data-action="submit-import" id="import-submit">${icon("plus", 14)} 导入配置</button>
      </div>
    </div>`);
  hydrateIcons($("#modal-root"));
  bindImportModal();
}
function bindImportModal() {
  const fileInput = $("#import-file");
  const dropzone = $("#import-dropzone");
  if (fileInput) {
    fileInput.addEventListener("change", async () => {
      if (fileInput.files?.[0]) await readImportFile(fileInput.files[0]);
      fileInput.value = "";
    });
  }
  if (dropzone) {
    dropzone.addEventListener("click", () => fileInput?.click());
    dropzone.addEventListener("dragover", event => { event.preventDefault(); dropzone.classList.add("drag"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
    dropzone.addEventListener("drop", async event => {
      event.preventDefault();
      dropzone.classList.remove("drag");
      if (event.dataTransfer?.files?.[0]) await readImportFile(event.dataTransfer.files[0]);
    });
  }
}
async function readImportFile(file) {
  if (!file) return;
  if (file.size > 12 * 1024 * 1024) {
    toast("文件过大", "error", "配置文件不能超过 12 MB");
    return;
  }
  try {
    const text = await file.text();
    App.importState.content = text;
    App.importState.filename = file.name;
    const nameEl = $("#import-file-name");
    if (nameEl) nameEl.textContent = `${file.name} · ${fmtBytes(file.size)}`;
    const textarea = $("#import-content");
    if (textarea && file.size < 220_000) textarea.value = text;
    const nameInput = $("#import-name");
    if (nameInput && !nameInput.value) nameInput.value = file.name.replace(/\.(yaml|yml|txt)$/i, "");
    toast("文件已读取", "success", file.name, 2000);
  } catch (err) {
    toast("读取文件失败", "error", err.message);
  }
}
function switchImportTab(tab) {
  App.importState.mode = tab === "file" ? "file" : "url";
  const urlPanel = $("#import-url-panel");
  const filePanel = $("#import-file-panel");
  if (urlPanel) urlPanel.classList.toggle("hidden", tab !== "url");
  if (filePanel) filePanel.classList.toggle("hidden", tab !== "file");
  $$(".import-tabs button").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === tab));
}
async function submitImport() {
  const activate = Boolean($("#import-activate")?.checked);
  const name = ($("#import-name")?.value || "").trim();
  const mode = App.importState.mode;
  let body;
  if (mode === "url") {
    const url = ($("#import-url")?.value || "").trim();
    if (!url) { toast("请输入订阅链接", "error"); return; }
    if (!/^https?:\/\//i.test(url)) { toast("订阅链接格式不正确", "error", "请使用 http:// 或 https:// 开头的地址"); return; }
    body = { mode: "url", url, name };
  } else {
    const content = ($("#import-content")?.value || "").trim() || App.importState.content;
    if (!content) { toast("请选择或粘贴配置文件", "error"); return; }
    body = { mode: "content", content, name, filename: App.importState.filename };
  }
  const btn = $("#import-submit");
  if (btn) btn.setAttribute("aria-busy", "true");
  setBusy(true, mode === "url" ? "正在下载订阅…" : "正在解析配置…");
  try {
    const meta = await api("/api/profiles/import", { method: "POST", body });
    if (activate) {
      const busyLabel = $("#busy-label");
      if (busyLabel) busyLabel.textContent = "正在启用新配置…";
      await api(`/api/profiles/${encodeURIComponent(meta.id)}/activate`, { method: "POST" });
    }
    closeModal();
    await refreshState(true);
    await refreshProxies(true);
    App.rules = null;
    App.selectedGroup = null;
    updateShell();
    navigate("profiles", true);
    toast("配置导入成功", "success", `${meta.name} · ${meta.counts?.proxies || 0} 个节点${activate ? " · 已启用" : ""}`, 4600);
  } catch (err) {
    toast("导入失败", "error", err.message, 6500);
    if (btn) btn.removeAttribute("aria-busy");
  } finally {
    setBusy(false);
  }
}
function openRuleModal(index = null) {
  if (!App.rules) return;
  const editing = Number.isInteger(index);
  const rule = editing ? (App.rules.rules || []).find(item => item.index === index) : null;
  const types = ["DOMAIN-SUFFIX", "DOMAIN", "DOMAIN-KEYWORD", "DOMAIN-REGEX", "GEOIP", "GEOSITE", "IP-CIDR", "IP-CIDR6", "SRC-IP-CIDR", "DST-PORT", "SRC-PORT", "PROCESS-NAME", "PROCESS-PATH", "RULE-SET", "MATCH"];
  const typeOptions = types.map(type => `<option value="${type}" ${rule?.type === type ? "selected" : ""}>${type}</option>`).join("");
  const targets = [...(App.rules.groups || []), "DIRECT", "REJECT"];
  const targetOptions = targets.map(target => `<option value="${escapeAttr(target)}"></option>`).join("");
  openModal(`
    <div class="modal">
      <div class="modal-head">
        <div><h2>${editing ? "编辑路由规则" : "添加路由规则"}</h2><p>规则会按从上到下的顺序匹配，MATCH 必须位于最后。</p></div>
        <button class="modal-close" type="button" data-action="close-modal" aria-label="关闭">${icon("close", 13)}</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="rule-edit-index" value="${editing ? index : ""}">
        <div class="form-grid">
          <div class="form-field">
            <label for="rule-type">规则类型</label>
            <select class="select" id="rule-type" style="width:100%">${typeOptions}</select>
          </div>
          <div class="form-field">
            <label for="rule-target">目标策略</label>
            <input class="input" id="rule-target" list="rule-targets" value="${escapeAttr(rule?.target || App.rules.groups?.[0] || "DIRECT")}" placeholder="策略组或 DIRECT" autocomplete="off">
            <datalist id="rule-targets">${targetOptions}</datalist>
          </div>
        </div>
        <div class="form-field" id="rule-payload-field">
          <label for="rule-payload">匹配内容</label>
          <input class="input" id="rule-payload" value="${escapeAttr(rule?.payload || "")}" placeholder="例如 openai.com 或 10.0.0.0/8" autocomplete="off" spellcheck="false">
          <div class="form-hint" id="rule-payload-hint">域名写后缀即可，例如 openai.com；IP 规则使用 CIDR 格式。</div>
        </div>
        <div class="check-row">
          <input type="checkbox" id="rule-no-resolve" ${rule?.noResolve ? "checked" : ""}>
          <label for="rule-no-resolve">no-resolve（IP 规则不触发 DNS 解析）</label>
        </div>
        <div class="hint-box" style="margin-top:14px;margin-bottom:0">${icon("info", 12)}<span>${App.rules.kind === "core" ? "保存后会自动尝试热重载当前内核。" : "规则会写入当前配置；启动真实内核后生效。"} 内部规则使用索引定位，删除或编辑不会影响原配置注释之外的字段。</span></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-soft" type="button" data-action="close-modal">取消</button>
        <button class="btn btn-primary" type="button" data-action="submit-rule" id="rule-submit">${icon("check", 14)} ${editing ? "保存规则" : "添加规则"}</button>
      </div>
    </div>`);
  hydrateIcons($("#modal-root"));
  const typeSelect = $("#rule-type");
  const syncPayload = () => {
    const isMatch = typeSelect?.value === "MATCH";
    const field = $("#rule-payload-field");
    if (field) field.style.display = isMatch ? "none" : "";
  };
  typeSelect?.addEventListener("change", syncPayload);
  syncPayload();
}
async function submitRule() {
  const indexRaw = $("#rule-edit-index")?.value;
  const editing = indexRaw !== "" && indexRaw != null;
  const payload = {
    type: $("#rule-type")?.value || "DOMAIN-SUFFIX",
    payload: ($("#rule-payload")?.value || "").trim(),
    target: ($("#rule-target")?.value || "").trim(),
    noResolve: Boolean($("#rule-no-resolve")?.checked)
  };
  if (payload.type !== "MATCH" && !payload.payload) { toast("请填写规则内容", "error"); return; }
  if (!payload.target) { toast("请选择目标策略", "error"); return; }
  const btn = $("#rule-submit");
  if (btn) btn.setAttribute("aria-busy", "true");
  try {
    if (editing) await api(`/api/rules/${Number(indexRaw)}`, { method: "PUT", body: payload });
    else await api("/api/rules", { method: "POST", body: payload });
    closeModal();
    await refreshRules();
    await refreshState(true);
    renderRulesPage();
    toast(editing ? "规则已更新" : "规则已添加", "success", `${payload.type}${payload.payload ? " · " + payload.payload : ""} → ${payload.target}`);
  } catch (err) {
    toast("保存规则失败", "error", err.message, 5000);
    if (btn) btn.removeAttribute("aria-busy");
  }
}

/* ============================================================
   Global event wiring
   ============================================================ */
function bindGlobalEvents() {
  document.addEventListener("click", async event => {
    const confirmBtn = event.target.closest("[data-confirm]");
    if (confirmBtn) {
      event.preventDefault();
      event.stopPropagation();
      resolveConfirm(confirmBtn.dataset.confirm === "yes");
      return;
    }
    const actionEl = event.target.closest("[data-action]");
    if (actionEl) {
      const action = actionEl.dataset.action;
      if (action === "close-modal") {
        event.preventDefault();
        closeModal();
        return;
      }
      event.preventDefault();
      event.stopPropagation();
      try {
        await dispatchAction(action, actionEl);
      } catch (err) {
        console.error(err);
        toast("操作失败", "error", err.message || String(err));
      }
      return;
    }
    const pageEl = event.target.closest("[data-page]");
    if (pageEl) {
      event.preventDefault();
      navigate(pageEl.dataset.page);
    }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      if (App.modalOpen) closeModal();
      return;
    }
    const target = event.target;
    if ((event.key === "Enter" || event.key === " ") &&
        (target?.classList?.contains("node-card") || target?.classList?.contains("conn-group-row"))) {
      event.preventDefault();
      target.click();
    }
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
      const search = $("#" + ({ overview: "", proxies: "proxy-search", rules: "rules-search", connections: "conn-search", logs: "log-search" }[App.page] || ""));
      if (search) { event.preventDefault(); search.focus(); }
    }
  });

  const themeToggle = $("#theme-toggle");
  themeToggle?.addEventListener("click", () => {
    const resolved = document.documentElement.dataset.theme;
    chooseTheme(resolved === "dark" ? "light" : "dark");
    if (App.page === "settings") {
      $$(".theme-choice").forEach(btn => btn.classList.toggle("active", btn.dataset.themeChoice === App.themeMode));
    }
  });

  document.addEventListener("change", async event => {
    if (event.target?.id === "sys-proxy-switch") {
      await setSystemProxy(Boolean(event.target.checked), event.target);
    }
  });

  window.addEventListener("hashchange", () => {
    const page = (location.hash || "").replace("#", "");
    if (PAGE_META[page] && page !== App.page) navigate(page);
  });

  window.addEventListener("beforeunload", () => {
    /* The server owns cleanup; no need to block navigation. */
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
